<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memory ❤️</title>
<link rel="icon" type="image/png" href="./favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Outfit',sans-serif;

height:100vh;
overflow:hidden;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding-top:40px;

position:relative;

background:
linear-gradient(
180deg,
#fff3fa 0%,
#ffe8f4 20%,
#ffd8ec 45%,
#ffc8e5 70%,
#ffb9de 100%
);

}

/* Background Blur */

.blur{

position:absolute;

border-radius:50%;

filter:blur(90px);

opacity:.8;

animation:float 12s ease-in-out infinite alternate;

}

.blur.one{

width:350px;
height:350px;

background:#ffffff;

top:-80px;
left:-80px;

}

.blur.two{

width:320px;
height:320px;

background:#ffd4ea;

bottom:-80px;
right:-70px;

animation-delay:2s;

}

.blur.three{

width:260px;
height:260px;

background:#ffffff;

top:45%;
left:55%;

animation-delay:5s;

}

@keyframes float{

from{

transform:translateY(0) scale(1);

}

to{

transform:translateY(-20px) scale(1.15);

}

}

/* Sun */

.sun{

position:absolute;

top:70px;

width:180px;
height:180px;

border-radius:50%;

background:#fff7ca;

box-shadow:

0 0 80px rgba(255,245,180,.95),
0 0 180px rgba(255,220,120,.6);

filter:blur(2px);

}

/* Sparkles */

.sparkle{

position:absolute;

width:5px;
height:5px;

border-radius:50%;

background:white;

animation:twinkle 4s infinite;

}

@keyframes twinkle{

0%{
opacity:.2;
transform:scale(.5);
}

50%{
opacity:1;
transform:scale(1.8);
}

100%{
opacity:.2;
transform:scale(.5);
}

}

/* Floating Hearts */

.heart{

position:absolute;

font-size:20px;

opacity:.25;

animation:heartFloat linear infinite;

pointer-events:none;

}

@keyframes heartFloat{

0%{

transform:translateY(110vh) scale(.7);

}

100%{

transform:translateY(-20vh) scale(1.3);

}

}

.title{

font-size:46px;
font-weight:700;

color:white;

margin-bottom:30px;

text-align:center;

text-shadow:
0 0 12px rgba(255,255,255,.9),
0 0 30px rgba(255,255,255,.8);

z-index:10;

}
/* Card */

.card{

position:relative;

width:420px;

padding:20px;

border-radius:32px;

background:rgba(255,255,255,.25);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.45);

box-shadow:

0 20px 60px rgba(255,120,180,.25);

animation:swing 5s ease-in-out infinite;

z-index:5;

}

.card::before{

content:"";

position:absolute;

inset:-20px;

background:rgba(255,190,220,.35);

filter:blur(40px);

border-radius:40px;

z-index:-1;

}

@keyframes swing{

0%{

transform:rotate(-1deg);

}

50%{

transform:rotate(1deg);

}

100%{

transform:rotate(-1deg);

}

}

.camera{

position:relative;

overflow:hidden;

border-radius:22px;

}

video{

width:100%;

display:block;

border-radius:22px;

/* Tambahkan ini */
transform:scaleX(-1);

}

canvas{

width:100%;

display:block;

border-radius:22px;

display:none;

}

/* Flash */

.flash{

position:absolute;

inset:0;

background:white;

opacity:0;

pointer-events:none;

}

.flash.active{

animation:flash .45s;

}

@keyframes flash{

0%{

opacity:1;

}

100%{

opacity:0;

}

}

/* Caption */

.caption{

margin-top:18px;

text-align:center;

font-size:21px;

font-weight:600;

color:#ff4b91;

}

/* Notes */

.note{

margin-top:18px;

padding:14px;

border-radius:18px;

background:rgba(255,255,255,.45);

backdrop-filter:blur(10px);

color:#6f4d5b;

font-size:15px;

line-height:1.7;

text-align:center;

}
/* Buttons */

.buttons{

margin-top:20px;

display:flex;

justify-content:center;

gap:14px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:999px;

cursor:pointer;

font-family:'Outfit',sans-serif;

font-size:15px;

font-weight:600;

background:rgba(255,255,255,.65);

color:#ff4b91;

backdrop-filter:blur(12px);

transition:.3s;

box-shadow:

0 8px 25px rgba(255,120,180,.15);

}

button:hover{

transform:translateY(-4px);

background:white;

box-shadow:

0 0 25px rgba(255,170,210,.7);

}

/* Message */

.message{

position:absolute;

bottom:35px;

left:50%;

transform:translateX(-50%);

width:90%;

text-align:center;

font-size:22px;

font-weight:500;

color:white;

line-height:1.7;

opacity:0;

transition:1s;

text-shadow:

0 0 12px rgba(255,255,255,.9);

}

.message.show{

opacity:1;

}

/* Mobile */

@media(max-width:500px){

.title{

font-size:36px;

}

.card{

width:92%;

}

.buttons{

flex-direction:column;

}

button{

width:100%;

}

.message{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="blur one"></div>
<div class="blur two"></div>
<div class="blur three"></div>

<div class="sun"></div>

<div class="title">

Our Memory ❤️

</div>

<div class="card">

<div class="camera">

<video
id="video"
autoplay
playsinline
muted></video>

<canvas id="canvas"></canvas>

<div class="flash" id="flash"></div>

</div>

<div class="caption">

Smile for me, my love ❤️

</div>

<div class="note">

Every smile of yours becomes my favorite memory.
Even when we're far apart,
this little photo will always remind me
how lucky I am to have you. 💕

</div>

<div class="buttons">

<button onclick="takePhoto()">

📸 Take Photo

</button>

<button onclick="downloadPhoto()">

💾 Save Memory

</button>

</div>

</div>

<div class="message" id="message">

Every picture we take today
becomes tomorrow's sweetest memory. ❤️

</div>

<script>

const video=document.getElementById("video");

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const flash=document.getElementById("flash");

navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user"
}

})

.then(stream=>{

video.srcObject=stream;

})

.catch(()=>{

alert("Camera cannot be accessed.");

});

/* Sparkles */

for(let i=0;i<40;i++){

const s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(s);

}

/* Hearts */

const hearts=["💖","💕","💗","🤍"];

for(let i=0;i<18;i++){

const h=document.createElement("div");

h.className="heart";

h.innerHTML=hearts[Math.floor(Math.random()*hearts.length)];

h.style.left=Math.random()*100+"%";

h.style.animationDuration=12+Math.random()*10+"s";

h.style.animationDelay=Math.random()*10+"s";

document.body.appendChild(h);

}
/* ===========================
   TAKE PHOTO
=========================== */

function takePhoto(){

flash.classList.add("active");

setTimeout(()=>{

flash.classList.remove("active");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

/* Beauty Filter */

ctx.filter=
"brightness(1.08) contrast(1.04) saturate(1.15) sepia(.08)";

ctx.drawImage(video,0,0);

ctx.filter=
"brightness(1.08) contrast(1.04) saturate(1.15) sepia(.08)";

ctx.save();

ctx.translate(canvas.width,0);
ctx.scale(-1,1);

ctx.drawImage(video,0,0,canvas.width,canvas.height);

ctx.restore();

ctx.filter="none";
/* Soft Pink Overlay */

ctx.fillStyle="rgba(255,210,230,.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* Soft Glow */

ctx.globalCompositeOperation="screen";

ctx.fillStyle="rgba(255,255,255,.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.globalCompositeOperation="source-over";

video.style.display="none";
canvas.style.display="block";

document.getElementById("message").classList.add("show");

},180);

}

/* ===========================
   DOWNLOAD WITH FRAME
=========================== */

function downloadPhoto(){

if(canvas.style.display==="none"){

alert("Please take a photo first ❤️");
return;

}

const exportCanvas=document.createElement("canvas");

const padding=50;
const noteHeight=150;

exportCanvas.width=canvas.width+padding*2;
exportCanvas.height=canvas.height+padding*2+noteHeight;

const ectx=exportCanvas.getContext("2d");

/* Background */

const gradient=ectx.createLinearGradient(
0,
0,
0,
exportCanvas.height
);

gradient.addColorStop(0,"#fff5fb");
gradient.addColorStop(.5,"#ffe4f3");
gradient.addColorStop(1,"#ffd6ea");

ectx.fillStyle=gradient;
ectx.fillRect(
0,
0,
exportCanvas.width,
exportCanvas.height
);

/* White Polaroid */

ectx.fillStyle="#ffffff";

roundRect(
ectx,
20,
20,
exportCanvas.width-40,
exportCanvas.height-40,
30
);

ectx.fill();

/* Shadow */

ectx.shadowColor="rgba(255,120,180,.25)";
ectx.shadowBlur=35;

/* Draw Photo */

roundImage(
ectx,
canvas,
padding,
padding,
canvas.width,
canvas.height,
25
);

ectx.shadowBlur=0;

/* Caption */

ectx.fillStyle="#ff4b91";

ectx.font="700 34px Outfit";

ectx.textAlign="center";

ectx.fillText(

"Smile for me ❤️",

exportCanvas.width/2,

canvas.height+95

);

/* Note */

ectx.fillStyle="#777";

ectx.font="500 23px Outfit";

wrapText(

ectx,

"Every smile of yours becomes my favorite memory. ❤️",

exportCanvas.width/2,

canvas.height+140,

exportCanvas.width-100,

32

);

/* Date */

const today=new Date();

ectx.font="18px Outfit";

ectx.fillStyle="#b38a9d";

ectx.fillText(

today.toLocaleDateString(),

exportCanvas.width/2,

exportCanvas.height-40

);

/* Download */

const link=document.createElement("a");

link.download="OurMemory.png";

link.href=exportCanvas.toDataURL("image/png");

link.click();

}

/* ===========================
   HELPERS
=========================== */

function roundRect(ctx,x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.arcTo(x+w,y,x+w,y+h,r);

ctx.arcTo(x+w,y+h,x,y+h,r);

ctx.arcTo(x,y+h,x,y,r);

ctx.arcTo(x,y,x+w,y,r);

ctx.closePath();

}

function roundImage(ctx,img,x,y,w,h,r){

ctx.save();

roundRect(ctx,x,y,w,h,r);

ctx.clip();

ctx.drawImage(img,x,y,w,h);

ctx.restore();

}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){

const words=text.split(" ");

let line="";

let lines=[];

for(let n=0;n<words.length;n++){

const test=line+words[n]+" ";

const width=ctx.measureText(test).width;

if(width>maxWidth&&n>0){

lines.push(line);

line=words[n]+" ";

}else{

line=test;

}

}

lines.push(line);

for(let i=0;i<lines.length;i++){

ctx.fillText(

lines[i],

x,

y+(i*lineHeight)

);

}

}

</script>

</body>

</html>
