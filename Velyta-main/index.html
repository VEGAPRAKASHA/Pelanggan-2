<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You</title>
<link rel="icon" type="image/png" href="./favicon.png?v=2">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    min-height:100dvh;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    position:relative;

    background-image:url("pink-sky.png"); /* ganti dengan nama file */
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* Background Glow */

body::before{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(
circle,
rgba(255,255,255,.18) 0%,
rgba(255,192,203,.08) 40%,
transparent 75%
);

filter:blur(90px);
pointer-events:none;
}
body::after{
content:"";
position:absolute;
inset:0;

background:
linear-gradient(
180deg,
rgba(255,255,255,.06),
rgba(255,182,193,.08)
);

pointer-events:none;
}

/* stars */
.stars{
position:absolute;
inset:0;
pointer-events:none;
}
.star{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#fff;
opacity:.5;
animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{
0%,100%{opacity:.15;}
50%{opacity:.85;}
}

/* Envelope */

.envelope-wrapper{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
display:flex;
flex-direction:column;
align-items:center;
z-index:10;
animation:float 4s ease-in-out infinite;
}


.envelope{
    position:relative;
    width:360px;
    height:250px;
    perspective:1400px;
}

/* belakang */

.env-back{
    position:absolute;
    inset:0;
    background:linear-gradient(#fff8f3,#ffe7ef);
    border-radius:12px;
    box-shadow:
        0 30px 70px rgba(0,0,0,.25);
}

/* surat */

.letter{
    position:absolute;
    width:82%;
    height:92%;
    left:50%;
    bottom:18px;

    transform:translateX(-50%);
    background:white;
    border-radius:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;
    color:#ff4d7d;

    box-shadow:
        0 8px 20px rgba(0,0,0,.15);

    z-index:2;

    animation:letterUp 1.6s ease forwards;
    animation-delay:2s;
}

/* flap */

.flap{
    position:absolute;
    inset:0 auto auto 0;

    width:100%;
    height:58%;

    background:linear-gradient(#fff0f5,#ffd6e7);

    clip-path:polygon(0 0,100% 0,50% 100%);

    transform-origin:top;

    z-index:5;

    animation:openFlap 1.2s ease forwards;
    animation-delay:1s;

    backface-visibility:hidden;
}

/* pocket depan */

.front{
    position:absolute;
    bottom:0;
}

.front.left{

    width:50%;
    height:100%;

    left:0;

    background:#ffdce9;

    clip-path:polygon(0 0,100% 50%,0 100%);

    z-index:6;
}

.front.right{

    width:50%;
    height:100%;

    right:0;

    background:#ffd3e4;

    clip-path:polygon(100% 0,0 50%,100% 100%);

    z-index:6;
}

.front.bottom{

    left:0;
    right:0;
    bottom:0;

    height:60%;

    background:#ffc9dd;

    clip-path:polygon(0 100%,50% 15%,100% 100%);

    z-index:7;
}
.hint{
margin-top:26px;
font-size:13px;
font-weight:600;
letter-spacing:4px;
color:#dbeafe;
text-transform:uppercase;
opacity:.85;
}

/* Flowers */

.flower{
    position:fixed;

    left:50%;
    top:42%;

    opacity:0;

    pointer-events:none;

    transform:translate(-50%,-50%) scale(0);


    z-index:8;   /* supaya terlihat */

    filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));
}

.envelope-wrapper{
    z-index:10;
}

/* Message */

.message{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:clamp(2rem,5vw,4rem);
font-family:Georgia,serif;
color:white;
opacity:0;
z-index:999;
text-align:center;
padding:0 24px;
text-shadow:
0 0 25px rgba(255,255,255,.9);
animation:showMessage 2s forwards;
animation-delay:6s;
}

.fade{
position:absolute;
inset:0;
background:#0f172a;
opacity:0;
pointer-events:none;
animation:fadeOut 2s forwards;
animation-delay:11s;
}

/* Animations */

@keyframes sealPop{
0%{transform:translate(-50%,-50%) scale(0);}
100%{transform:translate(-50%,-50%) scale(1);}
}
@keyframes sealBreak{
to{
opacity:0;
transform:translate(-50%,-50%) scale(1.4) rotate(25deg);
}
}

@keyframes openFlap{

0%{

transform:rotateX(0deg);

z-index:10;

}

49%{

z-index:10;

}

50%{

z-index:1;

}

100%{

transform:rotateX(-180deg);

z-index:1;

}

}

@keyframes letterUp{

0%{
transform:translate(-50%,0);
}

100%{
transform:translate(-50%,-125px);
}

}

@keyframes flowerSpread{
0%{
opacity:0;
transform:translate(-50%,-20%) rotate(0deg) scale(0);
}
20%{
opacity:1;
transform:translate(-50%,-80%) rotate(20deg) scale(.4);
}
100%{
opacity:1;
transform:
translate(
calc(-50% + var(--x)),
calc(-50% + var(--y))
)
rotate(var(--r))
scale(var(--s));
}
}
@keyframes flowerFloat{

0%,100%{
transform:
translate(
calc(-50% + var(--x)),
calc(-50% + var(--y))
)
rotate(calc(var(--r) - 3deg))
scale(var(--s));
}

25%{
transform:
translate(
calc(-50% + var(--x) + 8px),
calc(-50% + var(--y) - 10px)
)
rotate(calc(var(--r) + 2deg))
scale(var(--s));
}

50%{
transform:
translate(
calc(-50% + var(--x) - 6px),
calc(-50% + var(--y) + 6px)
)
rotate(calc(var(--r) - 2deg))
scale(var(--s));
}

75%{
transform:
translate(
calc(-50% + var(--x) + 5px),
calc(-50% + var(--y) - 8px)
)
rotate(calc(var(--r) + 3deg))
scale(var(--s));
}

}
@keyframes showMessage{
to{opacity:1;}
}

@keyframes float{
0%,100%{transform:translate(-50%,-50%) translateY(0);}
50%{transform:translate(-50%,-50%) translateY(-12px);}
}

@keyframes fadeOut{
100%{opacity:1;}
}

@media(max-width:768px){
.message{
font-size:clamp(2rem,6vw,5rem);
animation-delay:7s;
}
.envelope{width:85vw;}
}

</style>
</head>
<body>

<div class="stars"></div>

<div class="envelope-wrapper">

<div class="envelope">

    <!-- Belakang -->
    <div class="env-back"></div>

    <!-- Surat -->
    <div class="letter">
        ❤
    </div>

    <!-- Flap Atas -->
    <div class="flap"></div>

    <!-- Pocket Depan -->
    <div class="front left"></div>
    <div class="front right"></div>
    <div class="front bottom"></div>

</div>
<div class="hint">A Letter For You</div>

</div>

<div class="message"></div>

<div class="fade"></div>

<script>

/* ---------- tiny twinkling stars, drawn once, cheap ---------- */
(function starfield(){
  const wrap = document.querySelector(".stars");
  const frag = document.createDocumentFragment();
  const count = window.innerWidth < 768 ? 40 : 70;
  for(let i=0;i<count;i++){
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.animationDelay = (Math.random()*3) + "s";
    frag.appendChild(s);
  }
  wrap.appendChild(frag);
})();

/* ---------- lightweight procedural flowers (inline SVG, no image requests) ---------- */

const petalPalettes = [
  ["#ff9ebb","#ff6f9d"],   // pink
  ["#ffd6e8","#ffb3d1"],   // blush
  ["#fff1a8","#ffe066"],   // yellow
  ["#c9b6ff","#a78bfa"],   // lavender
  ["#ffffff","#ffe3ec"],   // white
  ["#ffb199","#ff7e6b"]    // peach
];

function flowerDataUri(petalColorA, petalColorB, petals){
  let petalShapes = "";
  const step = 360 / petals;
  for(let i=0;i<petals;i++){
    const angle = i * step;
    petalShapes += `<ellipse cx="50" cy="27" rx="13" ry="21" fill="url(#g)" transform="rotate(${angle} 50 50)"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${petalColorA}"/>
        <stop offset="100%" stop-color="${petalColorB}"/>
      </linearGradient>
    </defs>
    ${petalShapes}
    <circle cx="50" cy="50" r="11" fill="#fff3b0"/>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* pre-build a small pool of flower variants once, reused across all instances (cheap) */
const flowerPool = [];
petalPalettes.forEach(([a,b])=>{
  [5,6].forEach(petals=>{
    flowerPool.push(flowerDataUri(a,b,petals));
  });
});

function createFlowers(){

  const isMobile = window.innerWidth < 768;
  const totalFlowers = isMobile ? 110 : 160;

  const frag = document.createDocumentFragment();

  for(let i=0;i<totalFlowers;i++){

    const flower = document.createElement("img");
    flower.src = flowerPool[Math.floor(Math.random()*flowerPool.length)];
    flower.decoding = "async";
    flower.loading = "eager";
    flower.className = "flower";
    flower.style.top = "42%";

    const depth = Math.random();
    if(depth < 0.3) flower.classList.add("bg");
    else if(depth < 0.7) flower.classList.add("mid");
    else flower.classList.add("front");

    const size = isMobile ? (36 + Math.random()*34) : (46 + Math.random()*56);
    flower.style.width = size + "px";

    /* full-radius scatter so the burst fills the whole viewport edge-to-edge,
       instead of a rigid grid — angle + distance gives an even, organic spread */
    const angle = Math.random() * Math.PI * 2;
    const maxDist = Math.max(window.innerWidth, window.innerHeight) * 0.62;
    const dist = Math.sqrt(Math.random()) * maxDist; // sqrt -> even density, not center-heavy
    const x = Math.cos(angle) * dist;
    const y = Math.sin(angle) * dist * 0.85; // slightly flatten vertically to match viewport

    flower.style.setProperty("--x", x + "px");
    flower.style.setProperty("--y", y + "px");
    flower.style.setProperty("--r", (Math.random()*720-360) + "deg");
    flower.style.setProperty("--s", (0.7 + Math.random()*1.3));

    flower.style.animationDuration = (3.2 + Math.random()*1.6) + "s";
    flower.style.animationDelay = (i*0.012) + "s";
    flower.style.animation =
        `flowerSpread 3.5s cubic-bezier(.16,1,.3,1) forwards ${(i*0.012)}s,
         flowerFloat 5s ease-in-out infinite ${3.5 + (i*0.012)}s`;

    frag.appendChild(flower);
  }

  document.body.appendChild(frag);
}

setTimeout(()=>{
  createFlowers();
},2600);

setTimeout(()=>{
  window.location.href="love.html";
},15000);

</script>

</body>
</html>
