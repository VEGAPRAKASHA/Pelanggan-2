<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Until Our Next Hello ❤️</title>

<link rel="icon" type="image/png" href="./favicon.png?v=2">
    
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

/* Hanging Polaroid */

.hanging-photo{
    position:relative;
    margin:50px auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.rope{
    position:absolute;
    top:-15px;
    width:260px;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(120,100,150,.5),
        transparent
    );
}

.polaroid{
    position:relative;
    width:340px;
    margin:auto;
    background:white;
    padding:15px;
    padding-bottom:70px;
    border-radius:12px;
    box-shadow:0 30px 70px rgba(255,105,180,.22);
    transform-origin:top center;
    animation:swing 6s ease-in-out infinite;
    transition:.4s;
}

.polaroid img{
    width:100%;
    height:390px;
    object-fit:cover;
    border-radius:8px;
}

.polaroid:hover{
    transform:rotate(-2deg) scale(1.04);
    box-shadow:0 45px 90px rgba(255,105,180,.28);
}

.photo-caption{
    position:absolute;
    left:0;
    bottom:22px;
    width:100%;
    text-align:center;
    font-family:'Playfair Display',serif;
    font-size:1.15rem;
    font-style:italic;
    color:#c0266b;
}

#musicBtn{
    position:fixed;
    bottom:25px;
    right:25px;
    z-index:9999;

    background:rgba(255,255,255,.25);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.5);
    border-radius:50px;

    padding:12px 18px;

    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;

    color:#6d4ca5;

    cursor:pointer;
    transition:.3s;
}

#musicBtn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(255,111,165,.25);
}

@media(max-width:768px){

    .polaroid{
        width:220px;
        padding:10px 10px 45px;
    }

    .polaroid img{
        height:250px;
    }

    .rope{
        width:200px;
    }

    #musicBtn{
        bottom:15px;
        right:15px;
        padding:10px 15px;
        font-size:13px;
    }
}
#selfieBtn{
    position:fixed;
    bottom:25px;
    left:25px;
    z-index:9999;

    background:rgba(255,255,255,.25);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.5);
    border-radius:50px;

    padding:12px 18px;

    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;

    color:#6d4ca5;

    cursor:pointer;
    transition:.3s;
}

#selfieBtn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(255,111,165,.25);
}

@media(max-width:768px){

    #selfieBtn{
        bottom:15px;
        left:15px;
        padding:10px 15px;
        font-size:13px;
    }

}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --pink:#ff5ea8;
    --purple:#d63384;
    --text:#6f3355;
    --glass:rgba(255,255,255,.28);
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:80px 20px;

    font-family:'Poppins',sans-serif;

    background:linear-gradient(
        180deg,
        #ffb8da 0%,
        #ffaad2 12%,
        #ff9cca 25%,
        #ff90c5 40%,
        #ff86c0 55%,
        #ff7abb 70%,
        #ff6eb5 85%,
        #ff63af 100%
    );

    position:relative;
}

/* Aurora */

body::before{
    content:"";
    position:fixed;
    width:900px;
    height:900px;
    background:radial-gradient(
        circle,
        rgba(96,165,250,.4),
        transparent 70%
    );
    top:-300px;
    left:-200px;
    animation:aurora1 12s ease-in-out infinite alternate;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:radial-gradient(
        circle,
        rgba(37,99,235,.3),
        transparent 70%
    );
    bottom:-250px;
    right:-200px;
    animation:aurora2 14s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes aurora1{
    to{
        transform:translate(120px,80px);
    }
}

@keyframes aurora2{
    to{
        transform:translate(-120px,-80px);
    }
}

/* SUN */

.sun{
    position:fixed;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    width:520px;
    height:520px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff8d9,
        #ffd8ea 55%,
        transparent 72%
    );
    filter:blur(20px);
    opacity:.9;
    animation:sunGlow 6s ease-in-out infinite;
    pointer-events:none;
    z-index:-2;
}

@keyframes sunGlow{

    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.08);
    }
}

/* Cloud */

.cloud{
    position:fixed;
    width:480px;
    height:150px;

    background:rgba(255,255,255,.55);

    border-radius:200px;

    filter:blur(18px);

    animation:cloudMove linear infinite;

    pointer-events:none;

    z-index:-1;

    box-shadow:
        0 0 80px rgba(255,255,255,.35),
        0 0 120px rgba(255,255,255,.25);
}

.cloud::before{
    content:"";
    position:absolute;

    width:220px;
    height:220px;

    left:45px;
    top:-90px;

    background:inherit;
    border-radius:50%;
}

.cloud::after{
    content:"";
    position:absolute;

    width:200px;
    height:200px;

    right:55px;
    top:-70px;

    background:inherit;
    border-radius:50%;
}

@keyframes cloudMove{

    from{
        transform:translateX(-500px);
    }

    to{
        transform:translateX(calc(100vw + 500px));
    }
}

/* Route */

.route{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:99;

    font-size:14px;
    font-weight:600;
    color:var(--purple);

    background:rgba(255,255,255,.3);
    padding:10px 18px;
    border-radius:50px;
    backdrop-filter:blur(15px);
}

/* Card */

.card{
    width:min(1000px,92vw);
    margin:auto;
    padding:60px;
    border-radius:40px;
    background:rgba(255,255,255,.22);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 35px 80px rgba(255,105,180,.18);
    text-align:center;
    position:relative;
    z-index:5;
    animation:fadeUp 1.2s ease;
}

/* Title */

.title{
    font-family:'Playfair Display',serif;
    font-size:clamp(3.8rem,7vw,5.5rem);
    font-weight:700;
    text-align:center;
    margin-bottom:18px;
    letter-spacing:1px;

    color:#fff8fc;

    text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 18px rgba(255,190,220,.25);

    animation:titleGlow 4s ease-in-out infinite;
}

/* Subtitle */

.subtitle{
    max-width:720px;
    margin:25px auto 0;
    font-size:1.1rem;
    line-height:2;
    color:#6f3355;
    text-align:center;
    text-shadow:none;
    animation:heartbeat 5s infinite;
}
    /* ===========================
   Countdown Header
=========================== */

.countdown-header{
    margin-top:60px;
    margin-bottom:30px;
    text-align:center;
}

.countdown-title{

    font-family:'Playfair Display',serif;
    font-size:clamp(2rem,4vw,3rem);
    font-weight:700;
    color:#fff8fc;

    letter-spacing:1px;

    margin-bottom:12px;

    text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 18px rgba(255,190,220,.25);

    animation:titleGlow 4s ease-in-out infinite;

}

.countdown-subtitle{

    max-width:700px;

    margin:auto;

    font-size:1rem;

    line-height:1.8;

    color:#6f3355;

    text-align:center;

}
/* ===========================
   Countdown
=========================== */

.countdown{
    width:100%;
    max-width:820px;

    margin:60px auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;

    justify-content:center;
    align-items:center;
}

.box{
    position:relative;

    aspect-ratio:1/1;
    width:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border-radius:28px;

    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.45);

    box-shadow:0 15px 35px rgba(255,105,180,.15);

    overflow:hidden;

    transition:.35s;
}

.box:hover{
    transform:translateY(-6px);
}

.box::before{
    content:"";

    position:absolute;

    inset:-60%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );

    transform:rotate(25deg);

    animation:shine 6s linear infinite;
}

.box::after{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:linear-gradient(
        90deg,
        #ff7eb6,
        #ffffff,
        #ff7eb6
    );

}

.number{
    font-size:clamp(2.2rem,5vw,4rem);
    font-weight:700;
    color:#fff;
    line-height:1;

    text-shadow:
        0 0 10px rgba(255,255,255,.45);

    margin-bottom:10px;
}

.label{
    font-size:.9rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    opacity:.8;
}

/* ===========================
   Message
=========================== */

.message{
    margin:50px auto 0;

    max-width:760px;

    text-align:left;

    font-size:1.05rem;
    line-height:2.1;

    color:#6f3355;
}

.quote{
    margin-top:50px;
    margin-inline:auto;

    max-width:700px;

    font-size:1.25rem;
    font-style:italic;
    text-align:center;

    color:#d63384;
}

.signature{
    margin-top:35px;

    text-align:center;

    font-size:1.2rem;
    font-weight:700;

    color:#c0266b;
}

/* ===========================
   Floating Stars
=========================== */

.star{
    position:fixed;
    color:#fff;

    opacity:.7;
    pointer-events:none;

    animation:
        starMove linear infinite,
        twinkle 3s ease-in-out infinite;
}

@keyframes starMove{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-120px);
    }

}

@keyframes twinkle{

    50%{
        opacity:.2;
    }

}

/* ===========================
   Floating Hearts
=========================== */

.heart{
    position:fixed;
    color:#93c5fd;

    opacity:.5;
    pointer-events:none;

    animation:heartFloat linear infinite;
}

@keyframes heartFloat{

    from{
        transform:
            translateY(100vh)
            translateX(0)
            rotate(0deg);
    }

    to{
        transform:
            translateY(-120px)
            translateX(60px)
            rotate(180deg);
    }

}

/* ===========================
   Glow
=========================== */

@keyframes glow{

    0%,100%{

        text-shadow:
            0 0 10px rgba(255,255,255,.9),
            0 0 20px rgba(255,210,235,.9),
            0 0 40px rgba(255,170,210,.8),
            0 0 70px rgba(255,120,190,.6);

        filter:
            drop-shadow(0 0 8px rgba(255,180,220,.8));

    }

    50%{

        text-shadow:
            0 0 20px rgba(255,255,255,1),
            0 0 35px rgba(255,220,240,1),
            0 0 70px rgba(255,170,220,.9),
            0 0 110px rgba(255,110,190,.8);

        filter:
            drop-shadow(0 0 20px rgba(255,180,220,1));

    }

}

/* ===========================
   Card
=========================== */

.card{
    width:min(1100px,92vw);

    margin:0 auto;

    padding:70px 60px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.title{
    font-size:2.5rem;
}

.subtitle{
    font-size:.95rem;
}

/* ===========================
   Responsive
=========================== */

@media (max-width:768px){

    .countdown{
        grid-template-columns:repeat(2,1fr);
        gap:18px;
        margin:40px auto;
    }

    .box{
        min-height:140px;
    }

    .number{
        font-size:2.8rem;
    }

    .label{
        font-size:.8rem;
    }

}

@media (max-width:480px){

    .route{
        font-size:12px;
        padding:8px 14px;
    }

    .title{
        font-size:2rem;
    }

    .countdown{
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }

    .box{
        min-height:120px;
        border-radius:22px;
    }

    .number{
        font-size:2.3rem;
    }

    .label{
        font-size:.72rem;
        letter-spacing:1px;
    }

}
</style>
</head>
<body>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<!-- Music Button -->
<button id="musicBtn">
❤️ Play Our Song
</button>
<!-- Selfie Button -->
<button id="selfieBtn">
    📸 Selfie Together
</button>
<!-- Route-->
<div class="route" id="route"></div>

    
<div class="card">

<!-- Title-->
<h1 class="title" id="title"></h1>

</h1>
<!-- Subtitle-->
<p class="subtitle" id="subtitle"></p>
    
<!-- FOTO POLAROID -->

<div class="hanging-photo">

    <div class="rope"></div>

    <div class="polaroid">

        <div class="clip"></div>
<!-- FOTO POLAROID -->    
<img id="photo" src="" alt="Photo">
  <!-- photo caption-->
        <div class="photo-caption" id="caption"></div>
    </div>

</div>

    <!-- Countdown Header -->
<div class="countdown-header">

    <h2 class="countdown-title">
        ⏳ Until We Meet Again
    </h2>

    <p class="countdown-subtitle">
        Every second brings us one step closer to finally seeing each other again.
    </p>

</div>
<div class="countdown">

<div class="box">
<div class="number" id="days">0</div>
<div class="label">Days</div>
</div>

<div class="box">
<div class="number" id="hours">0</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div class="number" id="minutes">0</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div class="number" id="seconds">0</div>
<div class="label">Seconds</div>
</div>

</div>
 <!-- Message -->
<div class="message" id="message"></div>
 <!-- Quote -->
<div class="quote" id="quote"></div>
 <!-- Signature -->
<div class="signature" id="signature"></div>

</div>

<script>

/* Music Player */

const music =
document.getElementById("bgMusic");

music.volume = 0.15;

const musicBtn =
document.getElementById("musicBtn");

let isPlaying=false;

musicBtn.addEventListener("click",()=>{

if(!isPlaying){

music.play();
musicBtn.innerHTML="⏸ Pause Music";
isPlaying=true;

}else{

music.pause();
musicBtn.innerHTML="❤️ Play Our Song";
isPlaying=false;

}

});

/* Autoplay setelah interaksi pertama */

document.addEventListener("click",()=>{

if(!isPlaying){

music.play();
musicBtn.innerHTML="⏸ Pause Music";
isPlaying=true;

}

},{once:true});
  
/* Countdown */

let targetDate = 0;
function flash(id){

const el=document.getElementById(id);

el.classList.add("flash");

setTimeout(()=>{
el.classList.remove("flash");
},300);
}

function updateCountdown(){
if(targetDate === 0) return;
const now=new Date().getTime();

const distance=targetDate-now;

if(distance<0){

document.body.innerHTML=`

<div style="
text-align:center;
padding:40px;
font-family:Poppins;
color:#6d4ca5;
">

<h1 style="
font-size:clamp(2rem,6vw,4rem);
">
🎉 Welcome Home Velyta ❤️
</h1>

<p style="
margin-top:20px;
line-height:2;
max-width:700px;
margin-inline:auto;
">
The countdown is finally over.
I can't wait to hear every story,
see every photo,
and finally say hello again.
</p>

</div>

`;

return;
}

const days=Math.floor(distance/(1000*60*60*24));

const hours=Math.floor(
(distance%(1000*60*60*24))
/
(1000*60*60)
);

const minutes=Math.floor(
(distance%(1000*60*60))
/
(1000*60)
);

const seconds=Math.floor(
(distance%(1000*60))
/
1000
);

document.getElementById("days").innerText=days;
document.getElementById("hours").innerText=hours;
document.getElementById("minutes").innerText=minutes;
document.getElementById("seconds").innerText=seconds;

flash("seconds");

}

updateCountdown();

setInterval(updateCountdown,1000);

/* Clouds */

for(let i=0;i<12;i++){

    const cloud=document.createElement("div");

    cloud.className="cloud";

    cloud.style.top=Math.random()*45+"vh";

    cloud.style.animationDuration=(40+Math.random()*30)+"s";

    cloud.style.animationDelay=(-Math.random()*50)+"s";

    cloud.style.opacity = 0.45 + Math.random() * 0.25;

    cloud.style.transform = `scale(${0.9 + Math.random() * 0.6})`;

    document.body.appendChild(cloud);

}
/* Selfie Button */

const selfieBtn = document.getElementById("selfieBtn");

selfieBtn.addEventListener("click", () => {

    // efek klik kecil
    selfieBtn.style.transform = "scale(.95)";

    setTimeout(() => {
        window.location.href = "selfie.html";
    }, 120);

});
</script>
<script src="js/loadWebsite.js"></script>
</body>
</html>
